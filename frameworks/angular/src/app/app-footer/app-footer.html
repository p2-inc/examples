<footer class="sm:py-20">
  <div class="mx-auto max-w-3xl px-6 lg:px-8">
    <div class="-mx-6 grid grid-cols-2 gap-0.5 overflow-hidden sm:mx-0 sm:rounded-2xl">
      <a
        href="https://phasetwo.io/docs/introduction/"
        target="_blank"
        rel="noreferrer"
        class="flex items-center justify-center gap-1 bg-purple-500/10 p-8 text-xl font-semibold text-slate-600/80 sm:p-10"
      >
        Docs
        <ng-container *ngTemplateOutlet="externalLinkIcon" />
      </a>
      <a
        href="https://github.com/p2-inc/"
        target="_blank"
        rel="noreferrer"
        class="flex items-center justify-center gap-1 bg-purple-500/10 p-8 text-xl font-semibold text-slate-600/80 sm:p-10"
      >
        Github
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1em"
          height="1em"
          viewBox="0 0 16 16"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59c.4.07.55-.17.55-.38c0-.19-.01-.82-.01-1.49c-2.01.37-2.53-.49-2.69-.94c-.09-.23-.48-.94-.82-1.13c-.28-.15-.68-.52-.01-.53c.63-.01 1.08.58 1.23.82c.72 1.21 1.87.87 2.33.66c.07-.52.28-.87.51-1.07c-1.78-.2-3.64-.89-3.64-3.95c0-.87.31-1.59.82-2.15c-.08-.2-.36-1.02.08-2.12c0 0 .67-.21 2.2.82c.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82c.44 1.1.16 1.92.08 2.12c.51.56.82 1.27.82 2.15c0 3.07-1.87 3.75-3.65 3.95c.29.25.54.73.54 1.48c0 1.07-.01 1.93-.01 2.2c0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"
          />
        </svg>
      </a>
      <a
        href="https://phasetwo.io/blog/"
        target="_blank"
        rel="noreferrer"
        class="flex items-center justify-center gap-1 bg-purple-500/10 p-8 text-xl font-semibold text-slate-600/80 sm:p-10"
      >
        Blog
        <ng-container *ngTemplateOutlet="externalLinkIcon" />
      </a>
      <a
        href="mailto:support@phasetwo.io"
        target="_blank"
        rel="noreferrer"
        class="flex items-center justify-center gap-1 bg-purple-500/10 p-8 text-xl font-semibold text-slate-600/80 sm:p-10"
      >
        Contact
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1em"
          height="1em"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2zm-2 0l-8 5l-8-5zm0 12H4V8l8 5l8-5z"
          />
        </svg>
      </a>
    </div>
  </div>
</footer>

<ng-template #externalLinkIcon>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="1em"
    height="1em"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <g
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
    >
      <path d="M12 5c-3.87 0 -7 3.13 -7 7c0 3.87 3.13 7 7 7c3.87 0 7 -3.13 7 -7" />
      <path d="M13 11l7 -7" />
      <path d="M21 3h-6M21 3v6" />
    </g>
  </svg>
</ng-template>
