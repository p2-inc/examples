name: Next.js (NextAuth.js)

on:
  push:
    branches: [main]
    paths:
      - "frameworks/nextjs/**"
      - ".github/workflows/nextjs.yml"
  pull_request:
    branches: [main]
    paths:
      - "frameworks/nextjs/**"
      - ".github/workflows/nextjs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/_node-ci.yml
    with:
      working-directory: frameworks/nextjs

  deploy:
    needs: ci
    uses: ./.github/workflows/_vercel-deploy.yml
    with:
      working-directory: frameworks/nextjs
    secrets:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_NEXTJS_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOYMENT_TOKEN }}
